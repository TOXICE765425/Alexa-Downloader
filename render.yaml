services:
  - type: web
    name: misstu-video-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

      - key: BOT_TOKEN
        sync: false

      - key: API_ID
        sync: false

      - key: API_HASH
        sync: false

      - key: ADMIN_ID
        sync: false
